<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d12">
<title>ไพ่ท้าท้าย</title>
<style>
:root{
  --bg:#0b0c11;
  --surface:#11131a;
  --card:#f6f2ea;
  --ink:#17171c;
  --muted:#8e929d;
  --line:rgba(255,255,255,.09);
  --accent:#e9689c;
  --accent-soft:rgba(233,104,156,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;
  color:#f7f7f8;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:4px}

.page{
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:28px 18px max(28px,env(safe-area-inset-bottom));
  position:relative;
  isolation:isolate;
}
.page::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 18% 15%, rgba(233,104,156,.11), transparent 28%),
    radial-gradient(circle at 85% 82%, rgba(116,133,255,.09), transparent 27%),
    linear-gradient(160deg,#090a0f 0%,#10121a 48%,#090a0f 100%);
}
.page::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 78%);
}

.shell{width:min(100%,560px);text-align:center}
.brand{margin-bottom:22px}
.brand h1{margin:0;font-size:clamp(25px,5vw,32px);font-weight:700;letter-spacing:-.02em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}

/* card — clean modern playing card */
.card-stage{
  width:min(100%,400px);
  aspect-ratio:3/4.25;
  margin:0 auto;
  perspective:1500px;
  position:relative;
}
.card-stage::before{
  content:"";
  position:absolute;
  inset:10px -5px -10px 7px;
  border-radius:34px;
  background:#151720;
  border:1px solid rgba(255,255,255,.06);
  z-index:-1;
  transform:rotate(1deg);
}
.card{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.22,.74,.28,1);
}
.card.reveal{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  border-radius:32px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,.38);
}
.back{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f6f6f7;
  background:linear-gradient(145deg,#13151d,#0f1117);
  border:1px solid rgba(255,255,255,.10);
}
.back::before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:23px;
  border:1px solid rgba(255,255,255,.08);
}
.back::after{
  content:"";
  position:absolute;
  width:230px;height:230px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.045);
  box-shadow:0 0 0 42px rgba(255,255,255,.018),0 0 0 84px rgba(255,255,255,.012);
}
.back-mark{position:relative;z-index:1;text-align:center}
.back-logo{
  width:76px;height:76px;
  display:grid;place-items:center;
  margin:0 auto 22px;
  border-radius:50%;
  background:#f4f1f6;
  color:#111218;
  font-size:19px;font-weight:800;letter-spacing:-.04em;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}
.back-mark strong{display:block;font-size:22px;line-height:1.2;letter-spacing:-.03em}
.back-mark span{display:block;color:rgba(255,255,255,.38);font-size:10px;letter-spacing:.16em;margin-top:9px}

.front{
  transform:rotateY(180deg);
  background:#f8f6f1;
  color:#17171c;
  display:flex;
  flex-direction:column;
  text-align:left;
  border:1px solid rgba(20,20,25,.08);
}
.card-accent{
  height:112px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--accent-soft),rgba(255,255,255,.38));
  border-bottom:1px solid rgba(23,23,28,.08);
}
.card-accent::before{
  content:"";
  position:absolute;
  width:190px;height:190px;
  border-radius:50%;
  right:-54px;top:-95px;
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
  box-shadow:0 0 0 28px color-mix(in srgb,var(--accent) 7%,transparent),0 0 0 56px color-mix(in srgb,var(--accent) 4%,transparent);
}
.card-accent::after{
  content:"";
  position:absolute;
  left:28px;bottom:0;
  width:56px;height:4px;
  border-radius:99px 99px 0 0;
  background:var(--accent);
}
.card-top{
  height:100%;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:20px 28px;
  position:relative;z-index:1;
}
.card-type-wrap{display:flex;flex-direction:column;gap:5px}
.category{
  display:block;
  color:#17171c;
  font-size:17px;
  font-weight:800;
  letter-spacing:-.02em;
}
.category-note{font-size:11px;color:#77747d}
.card-number{
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:50%;
  border:1px solid rgba(23,23,28,.12);
  background:rgba(255,255,255,.45);
  font-size:10px;
  color:#74717a;
  font-variant-numeric:tabular-nums;
}
.card-body{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:36px 34px 26px;
  position:relative;z-index:1;
}
.kicker{
  width:max-content;
  max-width:100%;
  padding:7px 10px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:10.5px;
  font-weight:700;
  margin-bottom:22px;
}
.task{
  margin:0;
  font-size:clamp(22px,5.2vw,28px);
  line-height:1.58;
  font-weight:700;
  letter-spacing:-.025em;
  text-wrap:pretty;
}
.penalty{
  margin-top:24px;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(23,23,28,.045);
  border:1px solid rgba(23,23,28,.07);
  color:#68656d;
  font-size:12px;
  line-height:1.55;
}
.penalty strong{color:#25242a;font-weight:800}
.penalty.hidden{display:none}
.card-footer{
  margin:0 34px 27px;
  padding-top:18px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  border-top:1px solid rgba(23,23,28,.09);
  color:#99969e;
  font-size:10.5px;
  position:relative;z-index:1;
}
.card-footer .mini-label{color:#77737c;font-weight:700}
.card-footer .instruction{text-align:right;line-height:1.45}
.controls{width:min(100%,390px);margin:22px auto 0}
.draw{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px 18px;
  background:#f5f3f7;
  color:#111218;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 12px 34px rgba(0,0,0,.22);
  transition:transform .16s ease,background .16s ease;
}
.draw:hover{background:#fff;transform:translateY(-1px)}
.draw:active{transform:scale(.985)}
.secondary-row{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}
.add-card-btn{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  background:rgba(255,255,255,.035);color:#c5c7ce;cursor:pointer;font-size:13px;font-weight:600;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.add-card-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#fff}
.meta{display:flex;justify-content:center;gap:12px;margin-top:11px;color:#727680;font-size:11px}
.meta span+span::before{content:"·";margin-right:12px;color:#3d4048}

/* add card dialog */
.dialog-backdrop{
  position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;
  background:rgba(5,6,9,.68);backdrop-filter:blur(12px);
}
.dialog-backdrop.open{display:grid}
.add-dialog{
  width:min(100%,420px);border-radius:22px;padding:22px;background:#15171f;
  border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 90px rgba(0,0,0,.45);text-align:left;
}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.dialog-head h2{margin:0;font-size:18px;line-height:1.35}
.dialog-head p{margin:5px 0 0;color:#858994;font-size:12px;line-height:1.55}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#aaaeb7;cursor:pointer;font-size:18px}
.field{margin-top:14px}.field label{display:block;margin-bottom:8px;color:#aeb1b9;font-size:12px;font-weight:600}
.cat-select{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat-option{border:1px solid var(--line);border-radius:10px;padding:9px 4px;background:#11131a;color:#858994;font-size:11px;cursor:pointer}
.cat-option.active{color:#fff}
.cat-option[data-cat="dare"].active{border-color:#d95f91;background:rgba(217,95,145,.16)}
.cat-option[data-cat="truth"].active{border-color:#3e9db0;background:rgba(62,157,176,.15)}
.cat-option[data-cat="drink"].active{border-color:#b77b26;background:rgba(183,123,38,.15)}
.cat-option[data-cat="rule"].active{border-color:#558d61;background:rgba(85,141,97,.15)}
.cat-option[data-cat="bonus"].active{border-color:#7659ae;background:rgba(118,89,174,.15)}
textarea{
  width:100%;min-height:116px;resize:vertical;border-radius:14px;border:1px solid var(--line);
  background:#101219;color:#f5f5f6;padding:13px 14px;font:inherit;font-size:14px;line-height:1.65;outline:none;
}
textarea:focus{border-color:rgba(255,255,255,.24)}
textarea::placeholder{color:#5f636d}
.dialog-actions{display:flex;gap:9px;margin-top:16px}
.dialog-actions button{flex:1;border-radius:13px;padding:12px 14px;font-weight:700;cursor:pointer}
.cancel-btn{border:1px solid var(--line);background:transparent;color:#a8abb4}
.save-btn{border:0;background:#f3f1f5;color:#111218}
.custom-count{margin-top:10px;text-align:center;color:#626671;font-size:10.5px}

.card-stage.flash .face{animation:cardPop .38s ease}
@keyframes cardPop{0%{scale:.97}60%{scale:1.015}100%{scale:1}}

@media(max-width:520px){
  .page{padding:20px 14px max(22px,env(safe-area-inset-bottom))}
  .brand{margin-bottom:17px}.brand h1{font-size:25px}.brand p{font-size:12px}
  .card-stage{width:min(88vw,365px)}
  .face{border-radius:27px}.card-stage::before{border-radius:28px}
  .card-accent{height:98px}.card-top{padding:18px 23px}.card-number{width:43px;height:43px}
  .card-body{padding:31px 28px 23px}.kicker{margin-bottom:18px}.card-footer{margin:0 28px 23px;padding-top:15px}
  .task{font-size:clamp(21px,6.8vw,26px)}
  .controls{width:min(88vw,365px);margin-top:18px}.draw{padding:14px 16px}
  .add-dialog{padding:18px}.cat-select{grid-template-columns:repeat(3,1fr)}
}

@media(prefers-reduced-motion:reduce){.card{transition:none}.card-stage.flash .face{animation:none}}
</style>
</head>
<body>
<main class="page">
  <section class="shell" aria-label="เกมไพ่ท้าท้าย">
    <header class="brand">
      <h1>ไพ่ท้าท้าย</h1>
      <p>จั่วหนึ่งใบ แล้วทำตามการ์ด</p>
    </header>

    <div class="card-stage" id="stage">
      <article class="card" id="card" aria-live="polite">
        <div class="face back" onclick="drawCard()">
          <div class="back-mark">
            <div class="back-logo">TT</div>
            <strong>ไพ่ท้าท้าย</strong>
            <span>DRAW A CARD</span>
          </div>
        </div>

        <div class="face front">
          <div class="card-accent">
            <div class="card-top">
              <div class="card-type-wrap">
                <span class="category" id="category">ท้า</span>
                <span class="category-note">ไพ่ท้าท้าย</span>
              </div>
              <span class="card-number" id="cardNumber">001</span>
            </div>
          </div>
          <div class="card-body">
            <div class="kicker" id="kicker">การ์ดของคุณ</div>
            <p class="task" id="task">กด “จั่วการ์ด” เพื่อเริ่มเล่น</p>
            <div class="penalty hidden" id="penalty">ถ้าไม่ทำการ์ดนี้ <strong>หมดแก้ว</strong></div>
          </div>
          <div class="card-footer">
            <span class="mini-label">ไพ่ท้าท้าย</span>
            <span class="instruction">ทำตามการ์ด แล้วจั่วใบต่อไป</span>
          </div>
        </div>
      </article>
    </div>

    <div class="controls">
      <button class="draw" id="drawButton" onclick="drawCard()">จั่วการ์ด</button>
      <div class="secondary-row">
        <button class="add-card-btn" onclick="openAddDialog()">เพิ่มการ์ดของคุณ</button>
      </div>
      <div class="meta"><span id="deckCount">พร้อมเล่น</span><span>กด Space เพื่อจั่ว</span></div>
      <div class="custom-count" id="customCount"></div>
    </div>
  </section>
</main>

<div class="dialog-backdrop" id="addDialog" onclick="backdropClose(event)">
  <section class="add-dialog" role="dialog" aria-modal="true" aria-labelledby="addDialogTitle">
    <div class="dialog-head">
      <div>
        <h2 id="addDialogTitle">เพิ่มการ์ดของคุณ</h2>
        <p>การ์ดที่เพิ่มจะถูกสุ่มรวมกับกองปกติและบันทึกไว้ในเครื่องนี้</p>
      </div>
      <button class="icon-btn" onclick="closeAddDialog()" aria-label="ปิด">×</button>
    </div>
    <div class="field">
      <label>ประเภทการ์ด</label>
      <div class="cat-select" id="catSelect">
        <button class="cat-option active" data-cat="dare" onclick="selectCustomCategory('dare')">ท้า</button>
        <button class="cat-option" data-cat="truth" onclick="selectCustomCategory('truth')">ถาม</button>
        <button class="cat-option" data-cat="drink" onclick="selectCustomCategory('drink')">หมดแก้ว</button>
        <button class="cat-option" data-cat="rule" onclick="selectCustomCategory('rule')">กฎ</button>
        <button class="cat-option" data-cat="bonus" onclick="selectCustomCategory('bonus')">โบนัส</button>
      </div>
    </div>
    <div class="field">
      <label for="customText">ข้อความบนการ์ด</label>
      <textarea id="customText" maxlength="180" placeholder="เช่น เลือกคนหนึ่งในวง แล้วให้เขาตั้งคำถามกับคุณ 1 ข้อ"></textarea>
    </div>
    <div class="dialog-actions">
      <button class="cancel-btn" onclick="closeAddDialog()">ยกเลิก</button>
      <button class="save-btn" onclick="saveCustomCard()">เพิ่มลงกอง</button>
    </div>
  </section>
</div>

<script>
const CATEGORY={
  dare:{label:'ท้า',kicker:'ภารกิจของคุณ',color:'#d95f91',soft:'rgba(217,95,145,.16)'},
  truth:{label:'ถาม',kicker:'ตอบตามจริง',color:'#3e9db0',soft:'rgba(62,157,176,.15)'},
  drink:{label:'หมดแก้ว',kicker:'หมดแก้วตามการ์ด',color:'#b77b26',soft:'rgba(183,123,38,.15)'},

};

const CARDS=[

  ['truth','เรื่องที่ฮาที่สุดที่เคยเกิดในกลุ่มเพื่อนคืออะไร'],

  ['drink','ทุกคนชนแก้วหรือขวด แล้วหมดแก้วพร้อมกัน'],

  ['rule','ห้ามพูดคำว่า “ใช่” จนกว่าจะมีการ์ดกฎใบใหม่'],
  ['rule','ทุกประโยคต้องลงท้ายด้วย “นายท่าน” จนกว่าจะมีการ์ดกฎใบใหม่'],
  ['rule','ก่อนพูดต้องยกมือเหมือนขออนุญาต ใครลืมต้องทำท่าโพส 5 วินาที'],
  ['rule','ห้ามเรียกชื่อจริง ต้องเรียกด้วยฉายาที่วงตั้งให้'],
  ['rule','ถ้ามีคนพูดคำว่า “จริงดิ” ทุกคนต้องปรบมือ 1 ครั้ง'],
  ['rule','ห้ามใช้คำว่า “ไม่รู้” ใครพลาดต้องตอบคำถาม 1 ข้อ'],
  ['rule','เพิ่มกฎใหม่ของวงได้ 1 ข้อ โดยทุกคนต้องเห็นด้วย'],

  ['bonus','ข้ามภารกิจใบนี้ได้ทันที'],
  ['bonus','เลือกเพื่อน 1 คนมาทำภารกิจใบถัดไปร่วมกับคุณ'],
  ['bonus','เลือกคนหนึ่งในวงให้จั่วใบถัดไปแทนคุณ'],
  ['bonus','จั่วเพิ่มอีก 1 ใบทันที'],
  ['bonus','เลือกหมวดที่อยากได้สำหรับใบถัดไป แล้วจั่วใหม่ได้ 1 ครั้ง']
];

let deck=[];
let drawn=0;
let busy=false;
let customCategory='dare';
let customCards=loadCustomCards();

function shuffle(items){
  const a=items.map((x,i)=>({cat:x[0],text:x[1],id:i+1}));
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function allCards(){return [...CARDS,...customCards]}
function resetDeck(){deck=shuffle(allCards())}

function drawCard(){
  if(busy)return;
  if(!deck.length)resetDeck();
  busy=true;

  const cardEl=document.getElementById('card');
  const stage=document.getElementById('stage');
  const isShowing=cardEl.classList.contains('reveal');

  const revealNew=()=>{
    const item=deck.pop();
    drawn++;
    const c=CATEGORY[item.cat];
    document.documentElement.style.setProperty('--accent',c.color);
    document.documentElement.style.setProperty('--accent-soft',c.soft);
    document.getElementById('category').textContent=c.label;
    document.getElementById('kicker').textContent=c.kicker;
    document.getElementById('task').textContent=item.text;
    const penalty=document.getElementById('penalty');
    penalty.classList.toggle('hidden',item.cat==='rule');
    document.getElementById('cardNumber').textContent=String(drawn).padStart(3,'0');
    document.getElementById('deckCount').textContent='เหลือ '+deck.length+' ใบ';
    document.getElementById('drawButton').textContent='จั่วใบต่อไป';
    cardEl.classList.add('reveal');
    stage.classList.remove('flash');
    void stage.offsetWidth;
    stage.classList.add('flash');
    setTimeout(()=>{busy=false},650);
  };

  if(isShowing){
    cardEl.classList.remove('reveal');
    setTimeout(revealNew,320);
  }else{
    revealNew();
  }
}


function loadCustomCards(){
  try{
    const saved=JSON.parse(localStorage.getItem('tt_custom_cards')||'[]');
    return Array.isArray(saved)?saved.filter(x=>Array.isArray(x)&&CATEGORY[x[0]]&&typeof x[1]==='string'):[];
  }catch{return []}
}
function persistCustomCards(){
  localStorage.setItem('tt_custom_cards',JSON.stringify(customCards));
  updateCustomCount();
}
function updateCustomCount(){
  const el=document.getElementById('customCount');
  if(!el)return;
  el.textContent=customCards.length?`การ์ดที่เพิ่มเอง ${customCards.length} ใบ`:'';
}
function openAddDialog(){
  document.getElementById('addDialog').classList.add('open');
  setTimeout(()=>document.getElementById('customText').focus(),0);
}
function closeAddDialog(){
  document.getElementById('addDialog').classList.remove('open');
}
function backdropClose(e){if(e.target.id==='addDialog')closeAddDialog()}
function selectCustomCategory(cat){
  customCategory=cat;
  document.querySelectorAll('.cat-option').forEach(btn=>btn.classList.toggle('active',btn.dataset.cat===cat));
}
function saveCustomCard(){
  const input=document.getElementById('customText');
  const text=input.value.trim();
  if(!text){input.focus();return}
  customCards.push([customCategory,text]);
  persistCustomCards();
  const insertAt=Math.floor(Math.random()*(deck.length+1));
  deck.splice(insertAt,0,{cat:customCategory,text,id:CARDS.length+customCards.length});
  input.value='';
  document.getElementById('deckCount').textContent='เพิ่มการ์ดแล้ว · เหลือ '+deck.length+' ใบ';
  closeAddDialog();
}
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAddDialog();return}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.getElementById('addDialog').classList.contains('open')){
    e.preventDefault();
    saveCustomCard();
    return;
  }
  if(e.code==='Space'&&!document.getElementById('addDialog').classList.contains('open')){
    e.preventDefault();
    drawCard();
  }
});

resetDeck();
updateCustomCount();
</script>
</body>
</html>
